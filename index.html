    <glassi-fy mode="super"></glassi-fy>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('error', function(event) {
        document.body.innerHTML = '<div style="color:red;padding:20px;font-family:sans-serif;position:absolute;top:0;left:0;right:0;background:white;z-index:999999;"><h1>Client Error</h1><p>' + event.message + '</p><pre style="white-space:pre-wrap;">' + (event.error ? event.error.stack : '') + '</pre></div>';
      });
      window.addEventListener('unhandledrejection', function(event) {
        document.body.innerHTML = '<div style="color:red;padding:20px;font-family:sans-serif;position:absolute;top:0;left:0;right:0;background:white;z-index:999999;"><h1>Unhandled Promise Rejection</h1><p>' + event.reason + '</p><pre style="white-space:pre-wrap;">' + (event.reason && event.reason.stack ? event.reason.stack : '') + '</pre></div>';
      });
    </script>
  </body>
